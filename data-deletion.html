<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><title>Reels Inbox: Data Deletion</title><meta name='viewport' content='width=device-width'></head><body><style>body{font-family:sans-serif;max-width:40em;margin:2em auto;line-height:1.5}</style><h1>Reels Inbox: Data Deletion</h1>
<p>To delete any data Reels Inbox holds about you, remove the app from your Instagram account
(Settings → Website permissions → Apps and websites) and message the account owner. All stored
messages and notes derived from your messages will be deleted within 30 days.</p></body></html>
